{% extends "base.html" %}
{% block meta %}
    <title>Add Education - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="experience-section">
            <div class="container">
                <div class="form-card-wrapper">
                    <h1>Add New Education</h1>
                    <form method="post"
                          action="{% url 'main:create_education' %}"
                          class="education-form">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="form-group">
                                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                                {{ field }}
                                {% for error in field.errors %}
                                    <p class="form-error">{{ error }}</p>
                                {% endfor %}
                            </div>
                        {% endfor %}
                        <div class="project-form-actions">
                            <a href="{% url 'main:show_education' %}" class="button button-secondary">Batal</a>
                            <button type="submit" class="button">Tambah Education</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
